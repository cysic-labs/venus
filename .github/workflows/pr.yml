name: Test Venus

# GitHub-hosted runners only: this repository has no self-hosted runner, so the GPU proving tests of
# upstream ZisK (self-hosted GPU runners) are not run here. CUDA is absent on these runners, so the
# proving backend builds CPU-only.

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'book/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-tests:
    name: Cargo tests
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Use the committed ziskfloat artifacts (no Docker daemon in this container).
      ZISK_CI_NO_DOCKER_REBUILD: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh

      - name: Add Cargo to PATH
        # install_deps.sh installs Rust through rustup into ~/.cargo/bin.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Show versions
        run: |
          rustc --version
          cargo --version

      - name: Build cargo-zisk
        run: cargo build --bin cargo-zisk

      - name: Install ZisK rust toolchain
        run: ./target/debug/cargo-zisk toolchain install

      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run cargo test
        run: cargo test --workspace --release
        env:
          RUSTFLAGS: -Copt-level=3 -Cdebug-assertions -Coverflow-checks=y -Cdebuginfo=0 -C target-cpu=native
          RUST_BACKTRACE: 1

      - name: Run the wasm guest tests with the float feature
        run: cargo test -p ziskemu --release --features float --test wasm --test wasm_float --test wasm_example
        env:
          RUSTFLAGS: -Copt-level=3 -Cdebug-assertions -Coverflow-checks=y -Cdebuginfo=0 -C target-cpu=native
          RUST_BACKTRACE: 1

      # The compressed (C) decoder is off by default; check its traps fail too.
      - name: Run the failed-execution tests with the compressed feature
        run: cargo test --release -p ziskemu --features compressed --test failed_execution
        env:
          RUSTFLAGS: -Copt-level=3 -Cdebug-assertions -Coverflow-checks=y -Cdebuginfo=0 -C target-cpu=native
          RUST_BACKTRACE: 1

  build-riscv64im:
    name: Build ziskos-staticlib (riscv64im-unknown-none-elf)
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust nightly with rust-src
        # riscv64im-unknown-none-elf is a Tier 3 target: no pre-built std is available, so
        # -Z build-std compiles core/alloc from source. Rust links with its bundled rust-lld.
        run: rustup toolchain install nightly --component rust-src --no-self-update

      - name: Build ziskos-staticlib for riscv64im-unknown-none-elf
        run: cargo +nightly build -p ziskos-staticlib --release --target riscv64im-unknown-none-elf -Z build-std=core,alloc --config 'profile.release.lto="fat"' --features panic-handler
        env:
          RUSTFLAGS: "-D warnings"

  lint:
    name: Format & Clippy
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable

      - name: Install dependencies
        run: |
          cd "$GITHUB_WORKSPACE/tools/test-env"
          ./install_deps.sh

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Build cargo-zisk
        run: cargo build --bin cargo-zisk

      - name: Install ZisK rust toolchain
        run: ./target/debug/cargo-zisk toolchain install

      - name: Run cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings -A incomplete-features
        env:
          CARGO_INCREMENTAL: 1
